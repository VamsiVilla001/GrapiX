[package]
name = "gx-mock-engine"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "gx_mock_engine"
path = "src/lib.rs"

[[bin]]
name = "gx-mock-engine"
path = "src/main.rs"

[dependencies]
gx-contracts = { workspace = true }
gx-control-plane = { workspace = true }
gx-control-transport = { workspace = true }
gx-asset-plane = { workspace = true }
serde_json = { workspace = true }
# The engine's own preparation and headless render function (11.41): the mock
# draws through it, so it cannot render or refuse differently (invariant 45).
# It uses no GPU device, clock or transport from the worker.
gx-render-worker = { path = "../../services/render-engine/worker" }
