[package]
name = "playout-app"
version = "0.2.0"
description = "GrapiX Playout desktop shell"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "playout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
