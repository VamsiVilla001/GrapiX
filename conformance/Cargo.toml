[package]
name = "gx-conformance"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "gx_conformance"
path = "src/lib.rs"

[[bin]]
name = "gx-conformance"
path = "src/main.rs"

[dependencies]
gx-contracts = { workspace = true, features = ["fixtures"] }
gx-control-plane = { workspace = true }
gx-asset-plane = { workspace = true }
gx-media-plane = { workspace = true }
gx-mock-engine = { path = "../mocks/mock-engine" }
gx-render-worker = { path = "../services/render-engine/worker" }
serde_json = { workspace = true }
gx-control-transport = { workspace = true }
gx-playout = { path = "../services/playout" }
gx-editor = { path = "../services/editor" }
# 2.28: the refusal audit drives `settingInvalid` against the real settings store.
gx-settings = { path = "../Shared/settings" }
# 2.29: the refusal audit drives `workspaceInvalid` and `workspaceNewer` against the real store.
gx-workspace-store = { path = "../Shared/workspace-store" }
gx-editor-mcp = { path = "../services/editor-mcp" }
gx-playout-mcp = { path = "../services/playout-mcp" }
gx-mcp-server = { path = "../services/mcp-server" }
# 2.14: opens the bundle `gx-diag` writes. The same crate and feature `gx-diag` uses.
zip = { version = "2.4", default-features = false, features = ["deflate-zlib"] }
parking_lot = "0.12"
