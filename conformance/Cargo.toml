[package]
name = "gx-conformance"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "gx_conformance"
path = "src/lib.rs"

[[bin]]
name = "gx-conformance"
path = "src/main.rs"

[dependencies]
gx-contracts = { workspace = true, features = ["fixtures"] }
gx-control-plane = { workspace = true }
gx-asset-plane = { workspace = true }
gx-media-plane = { workspace = true }
gx-mock-engine = { path = "../mocks/mock-engine" }
gx-render-worker = { path = "../services/render-engine/worker" }
serde_json = { workspace = true }
gx-control-transport = { workspace = true }
gx-playout = { path = "../services/playout" }
gx-editor = { path = "../services/editor" }
gx-editor-mcp = { path = "../services/editor-mcp" }
gx-playout-mcp = { path = "../services/playout-mcp" }
gx-mcp-server = { path = "../services/mcp-server" }
parking_lot = "0.12"
