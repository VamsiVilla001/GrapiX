[package]
name = "grapix-render-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "GrapiX render core: parses SceneDocument JSON, prepares meshes, materials and shaped text, renders headlessly with wgpu, and hands frames to an output adapter. Library only; consumed by services/render-engine."
publish = false

[features]
default = []
# NDI transmission moved to grapix-render-engine. Retaining this feature preserves
# feature compatibility for callers of the render core without creating a sender.
ndi = []

[dependencies]
anyhow = "1"
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
gltf = { version = "1.4", features = ["import", "utils"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
lyon_path = "1"
lyon_tessellation = "1"
serde_json = "1"
thiserror = "2"
# `sync` and `time` only: the render core uses them for shared state and pacing. The
# multi-thread runtime, macros, net and signal handling went with the retired daemon binary.
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
# Pinned to a verified major. wgpu majors change APIs frequently; upgrade
# deliberately together with the browser WebGPU renderer, not incidentally.
wgpu = "26"

# NDI's dynamically loaded SDK binding belongs to the Engine-owned output worker.
cosmic-text = "0.14.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
wuff = "0.2.8"

[dev-dependencies]
# The library needs only `sync` and `time`. `#[tokio::test]` in `tests/gpu_smoke.rs` needs a
# runtime and the attribute macro, and declaring them here keeps them out of what
# `services/render-engine` compiles when it consumes this crate.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
