[package]
name = "grapix-render-engine"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
description = "GrapiX standalone render engine: an independent, headless-capable, tile-based real-time broadcast graphics renderer."
publish = false

[[bin]]
name = "grapix-render-engine"
path = "src/main.rs"

[features]
default = []
# Output adapters that need a vendor SDK are gated. The engine builds, runs, and
# passes its tests without any of them; the null and recording adapters are
# always available. Enabling a feature makes the adapter *compilable*, never
# "certified" — see docs/local-v1-system-design.md.
ndi = ["grapix-render-core/ndi", "dep:grafton-ndi"]

[dependencies]
# The proven native rendering core, reused rather than rewritten: scene parsing, mesh
# preparation, text shaping, pipeline caching and output adapters. The engine adds the virtual
# canvas, tiling, render graph, protocol v3, configuration, capabilities, preview and
# diagnostics on top.
#
# The directory is still `render-daemon` so git history stays attached to those files; the
# retired protocol-v2 daemon binary that gave it that name was removed 2026-07-29, so no
# package alias is needed any more.
grapix-render-core = { path = "../render-daemon" }

anyhow = "1"
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
glam = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util", "fs"] }
tokio-tungstenite = "0.26"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pinned to the same verified major as the render core. wgpu majors change APIs
# frequently; upgrade deliberately and together, never incidentally.
wgpu = "26"
# The engine owns the NDI sender and its dedicated transmission worker. This
# binding dynamically loads the vendor SDK; enabling the feature never bundles it.
grafton-ndi = { version = "1.0", optional = true }

[dev-dependencies]
tempfile = "3"
