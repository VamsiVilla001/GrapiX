# GrapiX installers — build plan 11.1 ("Installers produced by CI").
#
# Windows only (user decision, 8 and 19 Nov 2026): the Editor is bundled as an
# MSI on windows-latest and nothing else. Other OS builds return as new steps
# when the user re-adds them.
#
# Separate from `check.yml` on purpose. The gate must stay fast enough to run
# on every push; a release build compiles the whole workspace unoptimised-free
# and bundles it, which is minutes of work nobody needs on a typo fix.
#
# **Signing is real here, and it is gated on a secret that does not exist yet.**
# The signing step below is conditional on its secret being present, so this
# workflow produces:
#
#   - an **unsigned** installer today, and on any fork, and says so in the
#     artefact name; and
#   - a **signed** installer the moment the identity in
#     `docs/release-signing.md` is provisioned and the secret added.
#
# What it must never do is make an absent secret look like a success. An
# unsigned build is a legitimate artefact for testing and an illegitimate one
# for release, and the name is what keeps those apart.

name: installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this manual run"
        required: false

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    name: bundle (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      # The webview (WebView2) ships with Windows, so there is deliberately no
      # system-deps step.
      - name: Install dependencies
        run: npm ci

      # The frontend is embedded into the binary at compile time, so it must
      # be built before the bundler runs. A stale bundle here ships an Editor
      # whose UI predates its Rust.
      - name: Build the web layer
        run: npm run build:web

      # --- Signing material, only when the secret exists -------------------
      #
      # `tauri build` reads this from the environment. When the secret is
      # absent the variable is empty and the bundler produces an unsigned
      # artefact rather than failing, which is what makes a fork buildable.

      - name: Bundle the Editor
        env:
          # Windows Authenticode. Absent on a fork; the bundler then produces
          # an unsigned MSI.
          TAURI_WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
        run: npx tauri build --config Editor/shell/tauri.conf.json --bundles msi

      # Whether this run signed anything is recorded with the artefact, not
      # left to be inferred from which secrets happened to be configured.
      - name: Record the signing state
        shell: bash
        run: |
          if [ -n "${{ secrets.WINDOWS_SIGN_COMMAND }}" ]; then
            echo "signed=true" >> "$GITHUB_ENV"
          else
            echo "signed=false" >> "$GITHUB_ENV"
          fi

      - name: Fail a tagged release that produced an unsigned artefact
        if: startsWith(github.ref, 'refs/tags/v') && env.signed != 'true'
        run: |
          echo "A tagged release must be signed (build plan 11.1)."
          echo "See docs/release-signing.md for the identity and secret required."
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          # The name carries the signing state, so an unsigned artefact cannot
          # be mistaken for a releasable one after the fact.
          name: grapix-editor-windows-${{ env.signed == 'true' && 'signed' || 'UNSIGNED' }}
          path: target/release/bundle/**/*.msi
          if-no-files-found: error
          retention-days: 30
