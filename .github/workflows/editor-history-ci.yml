name: Editor history checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck editor
        run: npm run typecheck --workspace @grapix/editor-web
      - name: Test history
        run: npm run test --workspace @grapix/editor-web
