# GrapiX CI — build plan 0.3 (Windows from the first commit; macOS dropped by
# user decision on 8 Nov 2026) and 0.4 (SBOM on every build).
#
# The gate is `npm run check`: boundaries, codegen-staleness, typecheck, TS
# tests, Rust tests, and the conformance suite. A change is not mergeable
# unless it is green on both platforms — cross-platform drift is caught here,
# not by a client.

name: check

on:
  push:
    # agent/shared is the branch every agent commits to (user decision,
    # 8 Nov 2026): it is checked on both platforms on every push.
    branches: [GrapiX-2.0, main, agent/shared]
  pull_request:

# Cancel a superseded run on the same ref rather than queueing behind it.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows only (user decision, 8 Nov 2026): macOS is out of the current
        # scope. Re-add macos-latest here when it returns.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Pinned toolchain, matching rust-toolchain.toml, Cargo.toml rust-version
      # and package.json engines (0.2): Rust 1.89.0 with rustfmt+clippy, Node
      # >=22. A version, not "stable": on 8 Nov 2026 "stable" let CI install
      # Rust 1.99 while every workstation ran 1.89, and a lint only the newer
      # clippy knows failed the first run (user decision 7 Nov: Rust stays 1.89).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cache the cargo registry and target dir per-OS so the matrix stays
      # fast; a stale cache is keyed off Cargo.lock so a dependency change
      # rebuilds rather than reusing mismatched artifacts.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install JS dependencies
        run: npm ci

      - name: Lint (fmt + clippy)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Gate
        run: npm run check

      - name: Pixel gate
        run: cargo run -p gx-pixel-gate -- check

      # 0.4: a Software Bill of Materials on every build, so the dependency
      # and licence position is inspectable per artifact rather than asserted.
      # `always()`: a build whose lint, gate or pixel gate failed still records
      # what it contained (user decision, 8 Nov 2026). Before this, a failing
      # run stopped ahead of these steps and uploaded no SBOM.
      - name: Generate SBOM (Rust)
        if: always()
        run: cargo install cargo-sbom --locked && cargo sbom > sbom-rust.json

      - name: Generate SBOM (npm)
        if: always()
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom-npm.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-${{ matrix.os }}
          path: |
            sbom-rust.json
            sbom-npm.json
          retention-days: 30
