[package]
name = "gx-credential"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

# The gx1 HMAC credential (build plan 2.9), in a crate of its own (2.23) so that a transport that must
# verify one (the control plane, the MCP HTTP server) can do so without linking the control-plane
# client. Claims name a subject, a role and its scopes; nothing here sends or receives anything.

[dependencies]
gx-contracts = { workspace = true }
hmac = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[lib]
name = "gx_credential"
path = "src/lib.rs"

# `gx-credential mint ...`: a way to a credential for an engine that was started with a secret
# (`--token`). Prints the credential and nothing else.
[[bin]]
name = "gx-credential"
path = "src/main.rs"
