[package]
name = "gx-write-semantics"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

# The write-side primitives every mutating tool shares (build plan 8.12).
#
# if_revision, idempotency keys and batch-as-one-undo are properties of the
# write, not of any one tool. One crate holds them so a scene edit and a
# package publish behave identically under retry (invariant 27).

[dependencies]
gx-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = "0.12"
