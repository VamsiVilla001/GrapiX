# One workspace, one lockfile (invariant 24). ADR-003 records the four-project
# layout as the reason version pinning had to be enforced by convention.
[workspace]
resolver = "2"
members = [
  "Shared/contracts",
  "Shared/control-plane",
  "Shared/asset-plane",
  "Shared/media-plane",
  "Shared/control-transport",
  "Shared/credential",
  "Shared/telemetry",
  "Shared/console-stop",
  "Shared/diag",
  "Shared/shell-log",
  "Shared/fs",
  "Shared/decklink",
  "services/render-engine/host",
  "services/render-engine/worker",
  "mocks/mock-engine",
  "mocks/mock-playout",
  "mocks/mock-editor",
  "conformance",
  "tools/contract-codegen",
  "Shared/project-store",
  "Shared/write-semantics",
  "Shared/settings",
  "Shared/workspace-store",
  "Editor/shell",
  "Playout/shell",
  "services/editor",
  "services/editor-mcp",
  "services/figma-link",
  "services/mcp-server",
  "services/playout",
  "services/playout-mcp",
  "tools/pixel-gate",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "LicenseRef-Proprietary"
rust-version = "1.89"

[workspace.dependencies]
gx-contracts     = { path = "Shared/contracts" }
gx-control-plane = { path = "Shared/control-plane" }
gx-asset-plane   = { path = "Shared/asset-plane" }
gx-media-plane   = { path = "Shared/media-plane" }
gx-telemetry     = { path = "Shared/telemetry" }
gx-console-stop  = { path = "Shared/console-stop" }
gx-diag          = { path = "Shared/diag" }
gx-shell-log     = { path = "Shared/shell-log" }
gx-fs            = { path = "Shared/fs" }
gx-write-semantics = { path = "Shared/write-semantics" }
gx-settings      = { path = "Shared/settings" }
gx-workspace-store = { path = "Shared/workspace-store" }
gx-editor        = { path = "services/editor" }
gx-decklink      = { path = "Shared/decklink" }
gx-control-transport = { path = "Shared/control-transport" }
gx-credential   = { path = "Shared/credential" }
serde            = { version = "1", features = ["derive"] }
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
# `float_roundtrip` is required, not cosmetic. Every scene object flattens
# `ObjectBase`, and `#[serde(flatten)]` forces deserialisation through
# `deserialize_any`, whose default float parser is accurate to within one ULP
# rather than exact. Without this feature a scene written and read back is
# not the same scene: `0.18823529411764706` returns as `...703`, equality
# fails, and a content hash over the re-serialised document differs from the
# one over the original — which would make a `.gpxpkg` manifest (1.8) wrong.
serde_json       = { version = "1", features = ["float_roundtrip"] }
sha2             = "0.10"
# 2.16: let the render worker write `engine.stop` when Ctrl+C ends it.
# Downloaded with the user's approval (16 Nov 2026), exact version pinned.
# Since 2.18 only `gx-console-stop` uses it, and only off Windows: on Windows
# that crate registers the console handler itself (user-approved `unsafe`).
ctrlc            = "=3.5.2"
hmac             = "0.12"
ttf-parser       = "0.25"
ts-rs            = { version = "10", features = ["serde-json-impl"] }
url              = "2"
gx-project-store = { path = "Shared/project-store" }
tauri            = { version = "2", features = [] }
tauri-build      = { version = "2", features = [] }
tauri-plugin-dialog = "2"
memmap2         = "0.9"

interprocess     = "2.2"
widestring       = "1.2"
[profile.release]
lto = "thin"
panic = "abort"

# 3.17: the CPU drawing backend runs optimised even in debug builds. Headless
# renders draw full frames with it beside a live Program; unoptimised, a burst
# of them starved the Program thread of a frame in the debug conformance timed
# run (invariant 14). Only these crates; the product's own code stays debug.
[profile.dev.package.vello_cpu]
opt-level = 3
[profile.dev.package.vello_common]
opt-level = 3
[profile.dev.package.fearless_simd]
opt-level = 3
[profile.dev.package.kurbo]
opt-level = 3
