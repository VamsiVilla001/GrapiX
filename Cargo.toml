# One workspace, one lockfile (invariant 24). ADR-003 records the four-project
# layout as the reason version pinning had to be enforced by convention.
[workspace]
resolver = "2"
members = [
  "Shared/contracts",
  "Shared/control-plane",
  "Shared/asset-plane",
  "Shared/media-plane",
  "Shared/control-transport",
  "Shared/telemetry",
  "Shared/fs",
  "Shared/decklink",
  "services/render-engine/host",
  "services/render-engine/worker",
  "mocks/mock-engine",
  "mocks/mock-playout",
  "mocks/mock-editor",
  "conformance",
  "tools/contract-codegen",
  "Shared/project-store",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "LicenseRef-Proprietary"
rust-version = "1.89"

[workspace.dependencies]
gx-contracts     = { path = "Shared/contracts" }
gx-control-plane = { path = "Shared/control-plane" }
gx-asset-plane   = { path = "Shared/asset-plane" }
gx-media-plane   = { path = "Shared/media-plane" }
gx-telemetry     = { path = "Shared/telemetry" }
gx-fs            = { path = "Shared/fs" }
gx-decklink      = { path = "Shared/decklink" }
gx-control-transport = { path = "Shared/control-transport" }
serde            = { version = "1", features = ["derive"] }
# `float_roundtrip` is required, not cosmetic. Every scene object flattens
# `ObjectBase`, and `#[serde(flatten)]` forces deserialisation through
# `deserialize_any`, whose default float parser is accurate to within one ULP
# rather than exact. Without this feature a scene written and read back is
# not the same scene: `0.18823529411764706` returns as `...703`, equality
# fails, and a content hash over the re-serialised document differs from the
# one over the original — which would make a `.gpxpkg` manifest (1.8) wrong.
serde_json       = { version = "1", features = ["float_roundtrip"] }
sha2             = "0.10"
hmac             = "0.12"
ttf-parser       = "0.25"
ts-rs            = { version = "10", features = ["serde-json-impl"] }
url              = "2"
gx-project-store = { path = "Shared/project-store" }

[profile.release]
lto = "thin"
panic = "abort"
